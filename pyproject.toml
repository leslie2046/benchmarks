[project]
name = "prismlab"
version = "1.0.0"
description = "AI model performance testing and analysis"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
cli = ["requests>=2.32,<3"]
backend = [
  { include-group = "cli" },
  "Authlib>=1.6.6,<2",
  "fastapi>=0.116,<1",
  "cryptography>=45,<47",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "pydantic>=2.11,<3",
  "Pillow>=12.0,<13",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "deepeval==4.3.2",
  # OpenAI 3 introduces httpx2 and silently changes Authlib's existing transport.
  "openai>=2,<3",
]
dev = ["httpx>=0.28,<1"]

[tool.uv]
package = false
default-groups = ["backend", "dev"]
required-version = "==0.12.22"
