[project]
name = "prismlab"
version = "1.0.0"
description = "AI model performance testing and analysis"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
cli = ["requests>=2.32,<3"]
backend = [
  { include-group = "cli" },
  "fastapi>=0.116,<1",
  "cryptography>=45,<47",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
]
dev = ["httpx>=0.28,<1"]

[tool.uv]
package = false
default-groups = ["backend", "dev"]
required-version = "==0.12.22"
