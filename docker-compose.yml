services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BENCHMARK_DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./audio:/app/audio:ro

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
